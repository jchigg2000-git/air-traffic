version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      dev-deps:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dockerfile base images (node / golang / alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The presidio-analyzer pin lives in compose files, not a Dockerfile. The
  # `docker` ecosystem reads only Dockerfiles and Kubernetes/Helm YAML, so the
  # compose files need the dedicated ecosystem. A presidio bump must also
  # update deploy/presidio/README.md and re-run E2E_COMPOSE=1 ./scripts/e2e-gateway.sh.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /deploy/presidio
    schedule:
      interval: weekly

# No gomod entry: the module is stdlib-only (no require block, no go.sum) and
# CI fails the build if a go.sum ever appears.
