# Full Air-Traffic stack: control plane + inference gateway + Presidio.
#
#   docker compose up -d --build
#   open http://127.0.0.1:8122/            (SPA baked into the server image)
#
# The keys below fall back to throwaway dev values (gwk-demo /
# spine-dev-insecure) so the stack comes up with one command. Both binaries
# log a warning while those are in use. Before any shared deployment run
#   ./scripts/dev-env.sh
# which mints random GATEWAY_CLIENT_KEYS + AIRTRAFFIC_SPINE_KEY +
# AIRTRAFFIC_ADMIN_KEY into .env (compose reads it automatically). Until
# AIRTRAFFIC_ADMIN_KEY is set, every state-changing control-plane route accepts
# unauthenticated writes from anyone who can reach port 8122.
#
# The gateway serves two client dialects:
#   POST /v1/messages          Anthropic Messages  → the "anthropic" upstream
#   POST /v1/chat/completions  OpenAI-compatible   → the "openai" upstream
#
# The Anthropic route defaults to the SYNTHETIC upstream (self-contained demo).
# To proxy real Anthropic traffic, override in a .env file or the environment:
#   GATEWAY_UPSTREAM_BASE_URL=https://api.anthropic.com
#   ANTHROPIC_UPSTREAM_KEY=<real key>      (never committed; env-injected)
# then point Claude Code at ANTHROPIC_BASE_URL=http://127.0.0.1:8125 with
# ANTHROPIC_AUTH_TOKEN=<a GATEWAY_CLIENT_KEYS entry>.
#
# The OpenAI route points at the Hugging Face router by default but has NO
# default credential, so it 502s until you set one:
#   HF_UPSTREAM_TOKEN=<hf token>           (never committed; env-injected)
# then point an app's OpenAI-compatible client at
# http://127.0.0.1:8125/v1/chat/completions with a GATEWAY_CLIENT_KEYS entry as
# its bearer token. Set OPENAI_UPSTREAM_BASE_URL to front api.openai.com or any
# other OpenAI-compatible endpoint instead.
#
# NB: images bake built source — after a code change run
#   docker compose up -d --build <service>
# (a bare `docker compose restart` will NOT pick up code changes).
# The standalone deploy/presidio/docker-compose.yml must be DOWN before this
# stack starts (same host port 8126).

services:
  control-plane:
    build:
      context: .
      target: server
    ports:
      - "127.0.0.1:8122:8122"
    environment:
      AIRTRAFFIC_ADDR: 0.0.0.0:8122
      AIRTRAFFIC_DATA_DIR: /app/data/harness
      AIRTRAFFIC_GATEWAY_KEY: ${GATEWAY_CLIENT_KEYS:-gwk-demo}
      # shared key for the gateway spine routes (/api/gateway/leaks,
      # /enforcement, /patterns, /keys). Required here because the gateway
      # reaches the control plane over the compose network, not loopback.
      AIRTRAFFIC_SPINE_KEY: ${AIRTRAFFIC_SPINE_KEY:-spine-dev-insecure}
      # The gateway (spine + synthetic upstream) reaches this container by
      # service name. Loopback and localhost always pass; any other Host is 421
      # (internal/hostguard).
      AIRTRAFFIC_ALLOWED_HOSTS: control-plane
      # where the harness sends its traffic — pinned rather than taken from the
      # heartbeat's base_url, which any spine-key holder can write. Must match
      # the gateway's GATEWAY_ADVERTISE_URL below.
      AIRTRAFFIC_GATEWAY_URL: http://gateway:8125
      # Operator key for every state-changing route. Deliberately NO default:
      # the SPA is served from this container behind a published port, so the
      # browser arrives over the Docker bridge and would have to hold the key
      # for the consoles to work at all. Unset keeps the one-command demo
      # usable and the boot logs say the writes are open. Run
      # ./scripts/dev-env.sh to mint one, then paste it into the SPA's
      # "Operator key" field.
      AIRTRAFFIC_ADMIN_KEY: ${AIRTRAFFIC_ADMIN_KEY:-}
      # flywheel probe: raw Presidio scores are the threshold-proposal evidence
      AIRTRAFFIC_PRESIDIO_URL: http://presidio:3000
    volumes:
      - harness-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8122/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    ports:
      - "127.0.0.1:8125:8125"
    environment:
      GATEWAY_LISTEN_ADDR: 0.0.0.0:8125
      # peers (harness, Claude Code inside the network) reach it by service name
      GATEWAY_ADVERTISE_URL: http://gateway:8125
      # Two client dialects, two upstreams. The version segment sits on
      # different sides of the seam by ecosystem convention: an Anthropic
      # base_url is the bare host, an OpenAI-compatible one already ends in /v1.
      GATEWAY_UPSTREAMS: >-
        {"anthropic":{"base_url":"${GATEWAY_UPSTREAM_BASE_URL:-http://control-plane:8122/synthetic/anthropic}","credential_ref":"env:ANTHROPIC_UPSTREAM_KEY"},
         "openai":{"base_url":"${OPENAI_UPSTREAM_BASE_URL:-https://router.huggingface.co/v1}","credential_ref":"env:HF_UPSTREAM_TOKEN","auth":"bearer"}}
      ANTHROPIC_UPSTREAM_KEY: ${ANTHROPIC_UPSTREAM_KEY:-sk-ant-synthetic-dev}
      # Deliberately no default: an unset token fails credential resolution at
      # call time, so POST /v1/chat/completions returns 502 locally rather than
      # sending a junk credential to a real vendor.
      HF_UPSTREAM_TOKEN: ${HF_UPSTREAM_TOKEN:-}
      GATEWAY_CLIENT_KEYS: ${GATEWAY_CLIENT_KEYS:-gwk-demo}
      GATEWAY_CONTROL_PLANE_KEY: ${AIRTRAFFIC_SPINE_KEY:-spine-dev-insecure}
      GATEWAY_DETECTORS: regex,presidio
      GATEWAY_PRESIDIO_URL: http://presidio:3000
      # per_policy derives the action from the control plane's baseline and
      # hot-reloads it (pii_redaction off -> detect, on -> mask, on+phi ->
      # block until ZDR is attested). Only mask / block / per_policy are valid
      # here: `detect` is reachable only via policy, deliberately, so
      # monitor-only mode is a governance decision with an audit trail rather
      # than a container env var. .env can pin mask or block.
      GATEWAY_REDACT_ACTION: ${GATEWAY_REDACT_ACTION:-per_policy}
      GATEWAY_CONTROL_PLANE_URL: http://control-plane:8122
    depends_on:
      control-plane:
        condition: service_healthy
      presidio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8125/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  presidio:
    image: mcr.microsoft.com/presidio-analyzer:2.2.359
    ports:
      - "127.0.0.1:8126:3000"
    environment:
      LOG_LEVEL: WARNING
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

volumes:
  harness-data:
